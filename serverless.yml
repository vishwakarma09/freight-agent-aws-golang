service: freight-agent-api-go

provider:
  name: aws
  runtime: provided.al2023
  architecture: arm64
  memorySize: 512
  timeout: 29
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-2'}
  versionFunctions: false
  environment:
    # Non-sensitive runtime configuration ONLY.
    # All secrets (DATABASE_URL, JWT_SECRET, ENCRYPTION_KEY, CEREBRAS_API_KEY,
    # SMTP_*, GOOGLE_CLIENT_*, STRIPE_*) are loaded at runtime from AWS Secrets Manager.
    ENV: ${env:APP_ENV, 'prod'}
    AWS_SECRET_NAME: ${env:AWS_SECRET_NAME, 'freight-agent/prod/secrets'}
    S3_BUCKET_NAME: freight-private-${self:provider.stage}-${aws:accountId}
    FRONTEND_URL: https://freight.owera.ca
    ALLOWED_ORIGINS: https://freight.owera.ca
    RUN_MIGRATIONS: ${env:RUN_MIGRATIONS, 'true'}
    SMTP_TLS: "true"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}
            - arn:aws:s3:::${self:provider.environment.S3_BUCKET_NAME}/*
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:${self:provider.region}:${aws:accountId}:secret:freight-agent/*
        - Effect: Allow
          Action:
            - kms:GenerateDataKey
            - kms:Decrypt
          Resource:
            - arn:aws:kms:${self:provider.region}:${aws:accountId}:key/*

package:
  individually: true

functions:
  api:
    handler: bootstrap
    timeout: 29
    package:
      artifact: bin/api/api.zip
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{proxy+}
          method: ANY
  cron:
    handler: bootstrap
    timeout: 120
    package:
      artifact: bin/cron/cron.zip
    events:
      - schedule: rate(2 minutes)

resources:
  Resources:
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: freight-agent-frontend-go-${self:provider.stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: FrontendBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action:
                - s3:GetObject
              Resource:
                Fn::Join:
                  - ""
                  - - "arn:aws:s3:::"
                    - Ref: FrontendBucket
                    - "/*"

    FreightPrivateBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: freight-private-${self:provider.stage}-${aws:accountId}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Aliases:
            - freight.owera.ca
          Enabled: true
          HttpVersion: http2
          PriceClass: PriceClass_100
          DefaultRootObject: index.html
          ViewerCertificate:
            AcmCertificateArn: ${env:ACM_CERTIFICATE_ARN, ''}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          Origins:
            - Id: FrontendOrigin
              DomainName:
                Fn::Join:
                  - ""
                  - - Ref: FrontendBucket
                    - ".s3-website."
                    - Ref: AWS::Region
                    - ".amazonaws.com"
              CustomOriginConfig:
                HTTPPort: 80
                OriginProtocolPolicy: http-only
            - Id: ApiOrigin
              DomainName:
                Fn::Select:
                  - 2
                  - Fn::Split:
                      - "/"
                      - Fn::GetAtt:
                          - HttpApi
                          - ApiEndpoint
              CustomOriginConfig:
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
          DefaultCacheBehavior:
            TargetOriginId: FrontendOrigin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # AWS-managed SecurityHeadersPolicy (HSTS, X-Content-Type-Options, X-Frame-Options, Referrer-Policy)
            ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
          CacheBehaviors:
            - PathPattern: /api/*
              TargetOriginId: ApiOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
                - PUT
                - POST
                - PATCH
                - DELETE
              CachedMethods:
                - GET
                - HEAD
              DefaultTTL: 0
              MaxTTL: 0
              MinTTL: 0
              ForwardedValues:
                QueryString: true
                Headers:
                  - Authorization
                  - Content-Type
                  - Accept
                  - Accept-Encoding
                  - Origin
                  - Stripe-Signature
                  - X-Requested-With
                Cookies:
                  Forward: none

  Outputs:
    FrontendWebsiteUrl:
      Value:
        Fn::GetAtt:
          - FrontendBucket
          - WebsiteURL
      Description: URL of the frontend website hosted on S3
    PrivateBucketName:
      Value:
        Ref: FreightPrivateBucket
      Description: Private S3 bucket for freight documents
    CloudFrontDomainName:
      Value:
        Fn::GetAtt:
          - CloudFrontDistribution
          - DomainName
      Description: CloudFront distribution domain name
    CloudFrontDistributionId:
      Value:
        Ref: CloudFrontDistribution
      Description: CloudFront distribution ID
    CustomDomainUrl:
      Value: https://freight.owera.ca
      Description: Custom HTTPS domain URL
